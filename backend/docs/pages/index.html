<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Documentazione Progetto</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #111827;
      margin: 0;
      padding: 40px;
    }

    main {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
    }

    p {
      color: #4b5563;
    }

    .link-card {
      display: block;
      padding: 18px;
      margin-top: 16px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      text-decoration: none;
      color: #111827;
      background: #f9fafb;
    }

    .link-card:hover {
      background: #eef2ff;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
    }

    .description {
      margin-top: 6px;
      color: #4b5563;

</head>
<body>
  <main>
    <h1>Documentazione Progetto</h1>
    <p>Da questa pagina puoi accedere alla documentazione tecnica del backend.</p>

    <a class="link-card" href="./javadoc/">
      <div class="title">Javadoc</div>
      <div class="description">Documentazione delle classi Java del backend.</div>
    </a>

    <a class="link-card" href="./api/">
