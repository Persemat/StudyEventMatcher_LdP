  #   - until mysql -h"$DB_HOST" -u"$DB_USER" -p"$DB_PASSWORD" -e "SELECT 1"; do sleep 3; done
  #   - mvn verify -Pintegration

########################
# PACKAGE (artefatti pronti)
########################

package_backend:
  stage: package
  image: maven:3.9.6-eclipse-temurin-21
  dependencies:
    - compile_backend
  script:
    - cd backend
    - mvn package -DskipTests -DskipITs # crea il package del backend saltando i test --> crea il file .jar
  artifacts:
    paths:
      - backend/target/*.jar

package_frontend:
  stage: package
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline # crea il package del frontend
    - npm run build # effettua la build del frontend
  artifacts:
    paths:
      - frontend/dist

