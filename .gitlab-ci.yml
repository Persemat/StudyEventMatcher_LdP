stages:
  - validate
  - compile
  - unit_test
  - integration_test
  - documentation
  - package
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

########################
# GLOBAL CACHE
########################
cache:
  paths:
    - .m2/repository
    - frontend/.npm

########################
# VALIDATE
########################
validate_backend:
  stage: validate
  image: maven:3.9.6-eclipse-temurin-21
  script:
    - cd backend
    - mvn validate
    - mvn checkstyle:check || true

validate_frontend:
  stage: validate
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run lint || true

########################
# COMPILE
########################
compile_backend:
  stage: compile
  image: maven:3.9.6-eclipse-temurin-21
  script:
    - cd backend
    - mvn compile
  artifacts: 
    paths:
      - backend/target
    expire_in: 1 week

########################
# UNIT TEST
########################
unit_test_backend:
  stage: unit_test
  image: maven:3.9.6-eclipse-temurin-21
  needs:
    - compile_backend
  script:
    - cd backend
    - mvn test
  artifacts:
    when: always
    reports:
      junit:
        - backend/target/surefire-reports/*.xml
    expire_in: 1 week

########################
# INTEGRATION TEST
########################
integration_test_backend:
  stage: integration_test
  image: maven:3.9.6-eclipse-temurin-21
  needs:
    - compile_backend
  script:
    - cd backend
    - mvn failsafe:integration-test
    - mvn failsafe:verify
  artifacts:
    when: always
    reports:
      junit:
        - backend/target/failsafe-reports/*.xml
    expire_in: 1 week

########################
# DOCUMENTATION (GITLAB PAGES)
########################
pages:
  stage: documentation
  image: maven:3.9.6-eclipse-temurin-21
  needs:
    - compile_backend
  script:
    - cd backend
    - mvn javadoc:javadoc
    - cd ..
    - rm -rf public
    - mkdir -p public/javadoc
    - mkdir -p public/api
    - cp -r backend/target/reports/apidocs/* public/javadoc/
    - cp backend/docs/openapi.json public/api/openapi.json
    - cp -r backend/docs/pages/* public/
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
      - if: '$CI_COMMIT_BRANCH == "develop"'

########################
# PACKAGE STAGE
########################
package_backend:
  stage: package
  image: maven:3.9.6-eclipse-temurin-21
  needs:
    - unit_test_backend
    - integration_test_backend
  script:
    - cd backend
    - mvn package -DskipTests # Genera l'effettivo file .jar in backend/target/
  artifacts:
    paths:
      - backend/target/*.jar # Salva il JAR per passarlo al job successivo della pipeline
    expire_in: 1 week
  rules:
    # - if: '$CI_COMMIT_BRANCH == "main"' # <--- RIGA ORIGINALE DA SCOMMENTARE ALLA FINE
    - if: '$CI_COMMIT_BRANCH' # <--- REGOLA TEMPORANEA: fa girare il job su qualsiasi branch per i tuoi test

package_frontend:
  stage: package
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run build # Genera la cartella di produzione 'dist' in frontend/dist/
  artifacts:
    paths:
      - frontend/dist/ # Salva i file statici per passarli al job successivo
    expire_in: 1 week
  rules:
    # - if: '$CI_COMMIT_BRANCH == "main"' # <--- RIGA ORIGINALE DA SCOMMENTARE ALLA FINE
    - if: '$CI_COMMIT_BRANCH' # <--- REGOLA TEMPORANEA: fa girare il job su qualsiasi branch per i tuoi test

########################
# DEPLOY STAGE (DOCKER BUILD & PUSH)
########################
upload_to_registry:
  stage: deploy
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind # Abilita Docker-in-Docker per poter fare i comandi 'docker build'
  needs:
    - package_backend
    - package_frontend
  script:
    # 1. Effettua il login al Container Registry privato del tuo progetto GitLab
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

    # 2. Costruisce l'immagine di produzione del Backend usando il JAR scaricato dagli artefatti
    - cd backend
    - docker build -t $CI_REGISTRY_IMAGE/backend:latest -f Dockerfile.prod .
    - docker push $CI_REGISTRY_IMAGE/backend:latest
    - cd ..

    # 3. Costruisce l'immagine di produzione del Frontend usando la cartella dist scaricata dagli artefatti
    - cd frontend
    - docker build -t $CI_REGISTRY_IMAGE/frontend:latest -f Dockerfile.prod .
    - docker push $CI_REGISTRY_IMAGE/frontend:latest
    - cd ..
  rules:
    # - if: '$CI_COMMIT_BRANCH == "main"' # <--- RIGA ORIGINALE DA SCOMMENTARE ALLA FINE
    - if: '$CI_COMMIT_BRANCH' # <--- REGOLA TEMPORANEA: fa girare il job su qualsiasi branch per i tuoi test
