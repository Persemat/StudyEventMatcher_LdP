stages:
  - validate
  - compile
  - unit_test
  - integration_test
  - package
  - deploy

########################
# GLOBAL CACHE
########################

cache:
  paths:
    - .m2/repository
    - frontend/.npm

########################
# VALIDATE
########################

validate_backend:
  stage: validate
  image: maven:3.9.6-eclipse-temurin-21
  script:
    - cd backend
    - mvn validate # valida il progetto (pom.xml, struttura)
    - mvn checkstyle:check || true

validate_frontend:
  stage: validate
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run lint || true

########################
# COMPILE
########################

compile_backend:
  stage: compile
  image: maven:3.9.6-eclipse-temurin-21
  script:
    - cd backend
    - mvn compile # compila il backend usando maven
  artifacts:
    paths:
      - backend/target  # salva la compilazione in target
    expire_in: 1h

########################
# UNIT TEST
########################

unit_test_backend:
  stage: unit_test
  image: maven:3.9.6-eclipse-temurin-21
  dependencies:
    - compile_backend
  script:
    - cd backend
    - mvn test # esegue gli unit test

########################
# INTEGRATION TEST
########################

integration_test_backend:
  stage: integration_test
  image: maven:3.9.6-eclipse-temurin-21
  dependencies:
    - compile_backend
  script:
    - cd backend
    - mvn failsafe:integration-test # esegue integration e cucumber test
    - mvn failsafe:verify # effettua la verifica dei test

########################
# PACKAGE 
########################

package_backend:
  stage: package
  needs:
    - unit_test_backend
    - integration_test_backend
  image: maven:3.9.6-eclipse-temurin-21
  dependencies:
    - compile_backend
  script:
    - cd backend
    - mvn package -DskipTests -DskipITs # crea il package del backend saltando i test --> crea il file .jar
  artifacts:
    paths:
      - backend/target/*.jar

package_frontend:
  stage: package
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run build # effettua la build del frontend
  artifacts:
    paths:
      - frontend/dist

########################
# DEPLOY (artifact-based)
########################

deploy:
  stage: deploy
  image: alpine:latest
  dependencies:
    - package_backend
    - package_frontend
  script:
    - mkdir -p deploy
    - cp backend/target/*.jar deploy/app.jar
    - cp -r frontend/dist deploy/
  artifacts:
      paths:
        - deploy/
      expire_in: 1 week
  only:
    -main


# DOPO CHE LA PIPELINE VIENE ESEGUITA:
# cd deploy

# AVVIARE IL BACKEND
# java -jar app.jar

# AVVIARE IL FRONTEND IN LOCALE
# npx serve -s dist
