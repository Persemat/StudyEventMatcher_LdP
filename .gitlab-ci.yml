stages:
  - build
  - unit_test
  - integration_test
  - package
  - deploy

########################
# GLOBAL CACHE
########################

cache:
  paths:
    - .m2/repository
    - frontend/.npm

########################
# BUILD
########################

build_backend:
  stage: build
  image: maven:3.9.6-eclipse-temurin-21
  script:
    - cd backend
    - mvn compile
  artifacts:
    paths:
      - backend/target
    expire_in: 1h

build_frontend:
  stage: build
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
  artifacts:
    paths:
      - frontend/node_modules
    expire_in: 1h

########################
# UNIT TEST
########################

unit_test_backend:
  stage: unit_test
  image: maven:3.9.6-eclipse-temurin-21
  script:
    - cd backend
    - mvn test

########################
# INTEGRATION TEST (MySQL)
########################

integration_test_backend:
  stage: integration_test
  image: maven:3.9.6-eclipse-temurin-21
  script:
