stages:
  - validate
  - compile
  - unit_test
  - integration_test
  - documentation
  - package
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

########################
# GLOBAL CACHE
########################
cache:
  paths:
    - .m2/repository
    - frontend/.npm

########################
# VALIDATE
########################
validate_backend:
  stage: validate
  image: maven:3.9.6-eclipse-temurin-21
  script:
    - cd backend
    - mvn validate
    - mvn checkstyle:check || true

validate_frontend:
  stage: validate
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run lint 

########################
# COMPILE
########################
compile_backend:
  stage: compile
  image: maven:3.9.6-eclipse-temurin-21
  script:
    - cd backend
    - mvn compile
  artifacts: 
    paths:
      - backend/target
    expire_in: 1 week

########################
# UNIT TEST
########################
unit_test_backend:
  stage: unit_test
  image: maven:3.9.6-eclipse-temurin-21
  needs:
    - compile_backend
  script:
    - cd backend
    - mvn test
  artifacts:
    when: always
    reports:
      junit:
        - backend/target/surefire-reports/*.xml
    expire_in: 1 week

########################
# INTEGRATION TEST
########################
integration_test_backend:
  stage: integration_test
  image: maven:3.9.6-eclipse-temurin-21
  needs:
    - compile_backend
  script:
    - cd backend
    - mvn failsafe:integration-test
    - mvn failsafe:verify
  artifacts:
    when: always
    reports:
      junit:
        - backend/target/failsafe-reports/*.xml
    expire_in: 1 week

########################
# DOCUMENTATION (GITLAB PAGES)
########################
pages:
  stage: documentation
  image: maven:3.9.6-eclipse-temurin-21
  needs:
    - compile_backend
  script:
    - cd backend

    # Generate Javadoc
    - mvn -DskipTests -Dmaven.javadoc.failOnError=false javadoc:javadoc

    # Start backend with test configuration so OpenAPI can be generated without MySQL
    - mvn -DskipTests spring-boot:start -Dspring-boot.run.profiles=test -Dspring-boot.run.useTestClasspath=true

    # Wait for OpenAPI endpoint and save JSON
    - |
      for i in $(seq 1 30); do
        if curl -f http://localhost:8080/v3/api-docs -o target/openapi.json; then
          break
        fi
        echo "Waiting for /v3/api-docs..."
        sleep 2
      done

      if [ ! -f target/openapi.json ]; then
        echo "OpenAPI JSON was not generated"
        exit 1
      fi

    # Stop backend
    - mvn spring-boot:stop

    # Store OpenAPI beside generated site docs
    - mkdir -p target/site/openapi
    - mv target/openapi.json target/site/openapi/openapi.json

    - cd ..

    # Prepare GitLab Pages output folder
    - rm -rf public
    - mkdir -p public/javadoc
    - mkdir -p public/api

    # Copy Javadoc into /javadoc
    - |
      if [ -d backend/target/reports/apidocs ]; then
        cp -r backend/target/reports/apidocs/* public/javadoc/
      elif [ -d backend/target/site/apidocs ]; then
        cp -r backend/target/site/apidocs/* public/javadoc/
      else
        echo "Javadoc folder not found"
        exit 1
      fi

    # Copy OpenAPI JSON into /api
    - cp backend/target/site/openapi/openapi.json public/api/openapi.json

    # Create static Swagger UI page
    - |
      cat > public/api/index.html <<'EOF'
      <!DOCTYPE html>
      <html lang="it">
      <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Swagger UI - Backend API</title>
          <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist/swagger-ui.css">
      </head>
      <body>
          <div id="swagger-ui"></div>

          <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>
          <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-standalone-preset.js"></script>
          <script>
              window.onload = function () {
                  SwaggerUIBundle({
                      url: "./openapi.json",
                      dom_id: "#swagger-ui",
                      presets: [
                          SwaggerUIBundle.presets.apis,
                          SwaggerUIStandalonePreset
                      ],
                      layout: "StandaloneLayout"
                  });
              };
          </script>
      </body>
      </html>
      EOF

    # Create GitLab Pages homepage with links to Javadoc and Swagger
    - |
      cat > public/index.html <<'EOF'
      <!DOCTYPE html>
      <html lang="it">
      <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Project Documentation</title>
          <style>
              body {
                  font-family: Arial, sans-serif;
                  background: #f4f6f8;
                  color: #111827;
                  margin: 0;
                  padding: 40px;
              }

              main {
                  max-width: 800px;
                  margin: auto;
                  background: white;
                  padding: 32px;
                  border-radius: 12px;
                  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
              }

              h1 {
                  margin-top: 0;
              }

              p {
                  color: #4b5563;
              }

              .link-card {
                  display: block;
                  padding: 18px;
                  margin-top: 16px;
                  border: 1px solid #d1d5db;
                  border-radius: 10px;
                  text-decoration: none;
                  color: #111827;
                  background: #f9fafb;
              }

              .link-card:hover {
                  background: #eef2ff;
              }

              .title {
                  font-size: 20px;
                  font-weight: bold;
              }

              .description {
                  margin-top: 6px;
                  color: #4b5563;
              }
          </style>
      </head>
      <body>
          <main>
              <h1>Project Documentation</h1>
              <p>From this page you can access the backend technical documentation.</p>

              <a class="link-card" href="./javadoc/">
                  <div class="title">Javadoc</div>
                  <div class="description">Java class documentation for the backend.</div>
              </a>

              <a class="link-card" href="./api/">
                  <div class="title">Swagger UI</div>
                  <div class="description">REST API documentation generated from OpenAPI.</div>
              </a>
          </main>
      </body>
      </html>
      EOF

  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

########################
# DEPLOY
########################
deploy:
  stage: deploy
  image: alpine:latest
  needs:
    - package_backend
    - package_frontend
  script:
    - mkdir -p deploy
    - cp backend/target/*.jar deploy/app.jar
    - cp -r frontend/dist deploy/
  artifacts:
      paths:
        - deploy/
      expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

