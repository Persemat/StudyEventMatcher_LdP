stages:
  - validate
  - compile
  - unit_test
  - integration_test
  - documentation
  - package
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

########################
# GLOBAL CACHE
########################
cache:
  paths:
    - .m2/repository
    - frontend/.npm

########################
# VALIDATE
########################
validate_backend:
  stage: validate
  image: maven:3.9.6-eclipse-temurin-21
  script:
    - cd backend
    - mvn validate
    - mvn checkstyle:check || true

validate_frontend:
  stage: validate
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run lint || true

########################
# COMPILE
########################
compile_backend:
  stage: compile
  image: maven:3.9.6-eclipse-temurin-21
  script:
    - cd backend
    - mvn compile
  artifacts: 
    paths:
      - backend/target
    expire_in: 1 week

########################
# UNIT TEST
########################
unit_test_backend:
  stage: unit_test
  image: maven:3.9.6-eclipse-temurin-21
  needs:
    - compile_backend
  script:
    - cd backend
    - mvn test
  artifacts:
    when: always
    reports:
      junit:
        - backend/target/surefire-reports/*.xml
    expire_in: 1 week

########################
# INTEGRATION TEST
########################
integration_test_backend:
  stage: integration_test
  image: maven:3.9.6-eclipse-temurin-21
  needs:
    - compile_backend
  script:
    - cd backend
    - mvn failsafe:integration-test
    - mvn failsafe:verify
  artifacts:
    when: always
    reports:
      junit:
        - backend/target/failsafe-reports/*.xml
    expire_in: 1 week

########################
# DOCUMENTATION (GITLAB PAGES)
########################
pages:
  stage: documentation
  image: maven:3.9.6-eclipse-temurin-21
  needs:
    - compile_backend
  script:
    - cd backend
    - mvn javadoc:javadoc
    - cd ..
    - rm -rf public
    - mkdir -p public/javadoc
    - mkdir -p public/api
    - cp -r backend/target/reports/apidocs/* public/javadoc/
    - cp backend/docs/openapi.json public/api/openapi.json
    - cp -r backend/docs/pages/* public/
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
      - when: always
    # - if: '$CI_COMMIT_BRANCH == "develop"'

