stages:
  - build
  - test
  - package

# Build frontend
frontend-build:
  stage: build
  image: node:20
  script:
    - cd frontend
    - npm install
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    
backend-tests:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  dependencies:
    - frontend-build
  script:
    - mvn test -Dspring.profiles.active=test


# Build backend + integra frontend
backend-package:
  stage: package
  image: maven:3.9-eclipse-temurin-17
  dependencies:
    - frontend-build
  script:
    - mkdir -p src/main/resources/static
    - cp -r frontend/dist/* src/main/resources/static/
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar
