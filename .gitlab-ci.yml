#validate → compile → test → package → verify → install → deploy
stages:
  - compile
  - unit_test
  - integration_test
  - package
#  - deploy

########################
# GLOBAL CACHE
########################

cache:
  paths:
    - .m2/repository
    - frontend/.npm

########################
# COMPILE
########################

compile_backend:
  stage: compile
  image: maven:3.9.6-eclipse-temurin-21
  script:
    - cd backend
    - mvn compile # compila il backend usando maven
  artifacts:
    paths:
      - backend/target  # salva la compilazione in target
    expire_in: 1h

