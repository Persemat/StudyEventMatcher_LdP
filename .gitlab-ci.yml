stages:
  - frontend
  - backend
  - unit-test
  - integration-test
  - bdd
  - package

cache:
  - key: maven
    paths:
      - ~/.m2/repository
  - key: frontend
    paths:
      - frontend/node_modules/

# 1️⃣ FRONTEND
frontend-build:
  stage: frontend
  image: node:20
  before_script:
    - cd frontend
    - npm install
  script:
    - npm run build
  artifacts:
    paths:
      - frontend/dist/

# 2️⃣ BACKEND PREP
backend-prepare:
  stage: backend
  image: maven:3.9-eclipse-temurin-17
  dependencies:
    - frontend-build
  script:
    - mkdir -p src/main/resources/static
    - cp -r frontend/dist/* src/main/resources/static/
  artifacts:
    paths:
      - src/main/resources/static/

# 3️⃣ UNIT TEST
unit-tests:
  stage: unit-test
  image: maven:3.9-eclipse-temurin-17
  dependencies:
    - backend-prepare
  script:
    - mvn clean test -Dspring.profiles.active=test
  artifacts:
    when: always
    paths:
      - target/surefire-reports/

# 4️⃣ INTEGRATION TEST
integration-tests:
  stage: integration-test
  image: maven:3.9-eclipse-temurin-17
  dependencies:
    - backend-prepare
  script:
    - mvn clean verify -Dspring.profiles.active=test
  artifacts:
    when: always
    paths:
      - target/failsafe-reports/

# 5️⃣ CUCUMBER TEST (BDD)
cucumber-tests:
  stage: bdd
  image: maven:3.9-eclipse-temurin-17
  dependencies:
    - backend-prepare
  script:
    - mvn test -Dspring.profiles.active=test -Dtest=*Cucumber*
  artifacts:
    when: always
    paths:
      - target/cucumber-reports/

# 6️⃣ PACKAGE
package:
  stage: package
  image: maven:3.9-eclipse-temurin-17
  dependencies:
    - unit-tests
    - integration-tests
  script:
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar