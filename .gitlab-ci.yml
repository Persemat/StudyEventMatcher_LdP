stages:
  - build
  - unit-test
  - integration-test
  - package

frontend-build:
  stage: build
  image: node:20
  script:
    - cd frontend
    - npm install
    - npm run build
  artifacts:
    paths:
      - frontend/dist/

backend-unit-tests:
  stage: unit-test
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn clean test -Dspring.profiles.active=test

prepare-backend:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  dependencies:
    - frontend-build
  script:
    - mkdir -p src/main/resources/static
    - cp -r frontend/dist/* src/main/resources/static/
  artifacts:
    paths:
      - src/main/resources/static/

backend-integration-tests:
  stage: integration-test
  image: maven:3.9-eclipse-temurin-17
  dependencies:
    - prepare-backend
  script:
    - mvn verify -Dspring.profiles.active=test

backend-package:
  stage: package
  image: maven:3.9-eclipse-temurin-17
  dependencies:
    - prepare-backend
  script:
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar