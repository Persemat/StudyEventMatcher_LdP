workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    - when: never
stages:
  - frontend
  - backend
  - test
  - package

cache:
  # Maven
  - key: maven
    paths:
      - ~/.m2/repository
  # Node/NPM
  - key: frontend
    paths:
      - frontend/node_modules/

# 1️⃣ Build frontend
frontend-build:
  stage: frontend
  image: node:20
  before_script:
    - cd frontend
    - npm install
  script:
    - npm run build
  artifacts:
    paths:
      - frontend/dist/

# 2️⃣ Prepare backend (copy frontend build)
backend-prepare:
  stage: backend
  image: maven:3.9-eclipse-temurin-17
  dependencies:
    - frontend-build
  script:
    - mkdir -p src/main/resources/static
    - cp -r frontend/dist/* src/main/resources/static/
  artifacts:
    paths:
      - src/main/resources/static/

# 3️⃣ Unit tests
unit-tests:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  dependencies:
    - backend-prepare
  script:
    - mvn clean test -Dspring.profiles.active=test
  artifacts:
    when: always
    paths:
      - target/surefire-reports/

# 4️⃣ Integration tests
integration-tests:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  dependencies:
    - backend-prepare
  script:
    - mvn verify -Dspring.profiles.active=test

# 5️⃣ Package final application
package:
  stage: package
  image: maven:3.9-eclipse-temurin-17
  dependencies:
    - unit-tests
    - integration-tests
  script:
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar