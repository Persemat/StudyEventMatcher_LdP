#   script:
#     - cd frontend
#     - npm ci --cache .npm --prefer-offline
#   artifacts:
#     paths:
#       - frontend/node_modules
#     expire_in: 1h

########################
# UNIT TEST
########################

unit_test_backend:
  stage: unit_test
  image: maven:3.9.6-eclipse-temurin-21
  dependencies:
    - compile_backend
  script:
    - cd backend
    - mvn test # esegue gli unit test

########################
# INTEGRATION TEST
########################

integration_test_backend:
  stage: integration_test
  image: maven:3.9.6-eclipse-temurin-21
  dependencies:
    - compile_backend
  script:
  - cd backend
  - mvn failsafe:integration-test # esegue integration e cucumber test
  - mvn failsafe:verify # effettua la verifica dei test

  # services:
