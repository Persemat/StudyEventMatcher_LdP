########################
# PACKAGE (artefatti pronti)
########################

package_backend:
  stage: package
  image: maven:3.9.6-eclipse-temurin-21
  script:
    - cd backend
    - mvn package -DskipTests
  artifacts:
    paths:
      - backend/target/*.jar

package_frontend:
  stage: package
  image: node:22-alpine
  dependencies:
    - build_frontend
  script:
    - cd frontend
    - npm run build
  artifacts:
    paths:
      - frontend/dist

